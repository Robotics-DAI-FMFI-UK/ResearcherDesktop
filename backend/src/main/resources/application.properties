spring.application.name=researcher

spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
spring.web.error.include-message=always

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

logging.file.name=${LOG_FILE:logs/researcher.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.sk.uniba.fmph.dai.researcher=INFO

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/researcher}
spring.datasource.username=${DB_USERNAME:researcher}
spring.datasource.password=${DB_PASSWORD:researcher}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.from=${MAIL_FROM:${spring.mail.username}}
app.mail-from-name=${MAIL_FROM_NAME:ResearchDesk}
app.admin-email=${ADMIN_EMAIL}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/callback}
google.calendar.frontend-url=${GOOGLE_FRONTEND_URL:http://localhost:5173}

sftp.host=${SFTP_HOST:}
sftp.port=${SFTP_PORT:22}
sftp.username=${SFTP_USERNAME:}
sftp.password=${SFTP_PASSWORD:}
sftp.base-path=${SFTP_BASE_PATH:}
