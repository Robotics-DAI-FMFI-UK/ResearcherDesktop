spring.application.name=researcher

spring.datasource.url=jdbc:postgresql://localhost:5433/researcher
spring.datasource.username=researcher
spring.datasource.password=researcher

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
spring.web.error.include-message=always

jwt.secret=researcher-desktop-secret-key-change-in-production-2026
jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG